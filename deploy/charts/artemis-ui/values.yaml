# Default values for the Artemis UI chart.

image:
  # Docker Hub is the source of truth; the homelab pulls via the NAS
  # pull-through cache. Published by release.yml as <DOCKERHUB_USERNAME>/artemisui.
  repository: calvinference/artemisui
  # Pin to a released semver tag in production (matches the release workflow).
  tag: latest
  pullPolicy: IfNotPresent

# Single-node homelab cluster — 1 replica (siblings ship 1).
replicaCount: 1

# The in-cluster Artemis REST base URL the SERVER-SIDE BFF proxy forwards to.
# The BROWSER only ever calls this app's own origin (/api/artemis/*, baked into the
# image at build time); the pod proxies those to this upstream. This is a plain
# server-side env — NOT NEXT_PUBLIC (that must be baked at build time, see Dockerfile).
artemisUpstream: "http://artemis.artemis.svc.cluster.local:8080"

service:
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Exposure is off by default (per-service UI convention: reach it via port-forward,
# or turn exposure on when wanted). Defaults are the SAFE, cluster-reality shape:
# an empty className (k3s Traefik ignores a named class — no IngressClass resource
# exists) and no cert-manager (that stack isn't deployed). Opt IN to TLS by setting
# clusterIssuer once cert-manager exists. Two shapes are supported:
#   - Tailnet (sibling convention): className: "", host: artemis.tailscale, no TLS.
#   - Traefik + cert-manager (LAN TLS): className: traefik, clusterIssuer, tlsSecretName.
ingress:
  enabled: false
  className: ""
  host: artemis.tailscale
  # Set to a cert-manager ClusterIssuer to add TLS; empty = a plain (no-TLS) ingress.
  clusterIssuer: ""
  tlsSecretName: ""

# Run as an unprivileged container (the image already runs as uid 1001; Next.js
# standalone writes nothing to disk at runtime).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

nodeSelector: {}
tolerations: []
affinity: {}
